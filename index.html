<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMIC HBCCDA - Mask Mapping Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;font-size:13px}
.header{background:#161b22;padding:12px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:16px;color:#58a6ff;font-weight:600}
.header .sub{color:#8b949e;font-size:12px}
.tabs{display:flex;gap:0;margin-left:auto}
.tab{padding:6px 16px;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#8b949e;font-size:12px;transition:all .15s}
.tab:first-child{border-radius:6px 0 0 6px}
.tab:last-child{border-radius:0 6px 6px 0}
.tab.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.tab:hover:not(.active){color:#c9d1d9;border-color:#58a6ff}
.wrap{display:flex;height:calc(100vh - 49px)}

/* Left panel */
.device-panel{width:400px;min-width:400px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;padding:8px 0}
.cat-title{background:#1c2129;padding:6px 12px;font-weight:600;font-size:12px;color:#58a6ff;cursor:pointer;display:flex;justify-content:space-between;user-select:none;position:sticky;top:0;z-index:1}
.cat-title:hover{background:#21262d}
.cat-title .arr{transition:transform .2s;font-size:10px}
.cat-title.collapsed .arr{transform:rotate(-90deg)}
.cat-body{padding:4px 0}
.cat-body.hidden{display:none}
.dev-row{display:flex;align-items:center;padding:3px 12px;gap:8px;cursor:pointer}
.dev-row:hover{background:#1c2129}
.dev-row input[type=checkbox]{accent-color:#58a6ff;cursor:pointer}
.dev-row label{flex:1;font-size:11px;color:#c9d1d9;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev-row label .desc{color:#6e7681;font-size:10px}
.dev-row .mcount{font-size:10px;color:#6e7681;min-width:36px;text-align:right}
.search-box{width:calc(100% - 16px);margin:4px 8px 8px;padding:6px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:12px}
.search-box:focus{outline:none;border-color:#58a6ff}

/* Right panel */
.right-panel{flex:1;overflow-y:auto;padding:16px}
.right-panel h2{font-size:16px;color:#58a6ff;margin-bottom:12px}
.summary{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:16px;display:flex;gap:24px}
.summary .count{font-size:24px;font-weight:700;color:#3fb950}
.summary .label{font-size:11px;color:#8b949e}
.btn-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:6px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;font-size:12px;cursor:pointer}
.btn:hover{border-color:#58a6ff;color:#58a6ff}
.btn-primary{background:#238636;border-color:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}

/* Mask grid */
.mask-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:16px}
.mask-chip{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:5px 10px;font-size:11px;display:flex;align-items:center;gap:6px;cursor:default;transition:all .15s}
.mask-chip.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.mask-chip.clickable{cursor:pointer}
.mask-chip.clickable:hover{border-color:#58a6ff;box-shadow:0 0 0 1px #58a6ff}
.mask-chip.highlight{border-color:#f0883e;box-shadow:0 0 0 2px #f0883e}
.mask-chip .dot{width:8px;height:8px;border-radius:50%;background:#30363d;flex-shrink:0}
.mask-chip.active .dot{background:#3fb950}
.mask-chip .dev-badge{margin-left:auto;font-size:10px;color:#6e7681}
.mask-chip.active .dev-badge{color:rgba(255,255,255,.7)}

/* Mask detail popup */
.mask-detail{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px;display:none}
.mask-detail.show{display:block}
.mask-detail h3{font-size:14px;color:#f0883e;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mask-detail h3 .close-btn{cursor:pointer;color:#8b949e;font-size:16px;margin-left:auto}
.mask-detail h3 .close-btn:hover{color:#f85149}
.mask-detail .device-list{max-height:300px;overflow-y:auto}
.mask-detail .dev-item{padding:4px 8px;font-size:12px;display:flex;gap:8px;align-items:center}
.mask-detail .dev-item:hover{background:#1c2129;border-radius:4px}
.mask-detail .dev-item .cat-tag{font-size:10px;color:#8b949e;background:#21262d;padding:1px 6px;border-radius:3px;min-width:60px;text-align:center}
.mask-detail .dev-item .dev-name{color:#c9d1d9}
.mask-detail .dev-item .dev-desc{color:#6e7681;font-size:10px;margin-left:auto;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mask-detail .count-info{font-size:11px;color:#8b949e;margin-bottom:8px}

/* Tooltip */
.tooltip{position:fixed;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:8px 12px;font-size:11px;color:#c9d1d9;pointer-events:none;z-index:100;max-width:300px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.tooltip .tt-desc{color:#8b949e;font-size:10px;margin-top:2px}
.tooltip .tt-masks{color:#3fb950;margin-top:4px}
</style>
</head>

  <span class="sub">45 Masks | 303 Devices</span>

        <div class="device-list" id="maskDetailList"></div>
      </div>
      <div class="mask-grid" id="maskGridReverse"></div>
    </div>
  </div>
</div>

": "Metal Insulator Metal Capacitor (Cspe c=1.5fF/um^2)", "mim1d5_typ2_ckt": "Metal Insulator Metal Capacitor (Cspe c=1.5fF/um^2)"};

let selectedDevices = new Set();
let selectedMasks = new Set();
let searchQuery = '';
let currentMode = 'devices';

// ═══ Mode switching ═══
function setMode(mode){
  currentMode = mode;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && mode==='devices') || (i===1 && mode==='masks'));
  });
  document.getElementById('wrap').classList.toggle('mode-reverse', mode==='masks');
  document.getElementById('modeDevices').style.display = mode==='devices' ? '' : 'none';
  document.getElementById('modeMasks').style.display = mode==='masks' ? '' : 'none';
  document.getElementById('devicePanel').style.display = mode==='devices' ? '' : 'none';
  if(mode==='masks'){
    renderMaskGridReverse();
    document.getElementById('totalMasks').textContent = MASK_COLS.length;
    document.getElementById('masksWithDevs').textContent = Object.values(MASK_TO_DEVICES).filter(d=>d.length>0).length;
  }
}

// ═══ Device → Mask mode ═══
function renderDevicePanel(){
  const panel = document.getElementById('devicePanel');
  let html = '<input class="search-box" type="text" placeholder="Search devices or descriptions..." oninput="searchQuery=this.value.toLowerCase();renderDevicePanel()">';
  for(const [cat, devs] of Object.entries(DEVICES)){
    const filteredDevs = Object.entries(devs).filter(([name]) => {
      if(!searchQuery) return true;
      const desc = (DESC_MAP[name] || '').toLowerCase();
      return name.toLowerCase().includes(searchQuery) || cat.toLowerCase().includes(searchQuery) || desc.includes(searchQuery);
    });
    if(filteredDevs.length === 0 && searchQuery) continue;
    html += '<div class="cat-title" onclick="toggleCat(this)">' + cat + ' (' + filteredDevs.length + ') <span class="arr">▼</span></div>';
    html += '<div class="cat-body">';
    for(const [name, masks] of filteredDevs){
      const checked = selectedDevices.has(name) ? 'checked' : '';
      const safeId = 'dev_' + name.replace(/[^a-zA-Z0-9_]/g,'_');
      const safeName = name.replace(/'/g,"\\'");
      const desc = DESC_MAP[name] || '';
      html += '<div class="dev-row" onmouseenter="showTip(event,\'' + safeName + '\')" onmouseleave="hideTip()">' +
        '<input type="checkbox" id="' + safeId + '" ' + checked + ' onchange="toggleDevice(\'' + safeName + '\')">' +
        '<label for="' + safeId + '">' + name + (desc ? ' <span class="desc">| ' + desc + '</span>' : '') + '</label>' +
        '<span class="mcount">' + masks.length + ' masks</span>' +
        '</div>';
    }
    html += '</div>';
  }
  panel.innerHTML = html;
}

function renderMaskGrid(){
  const grid = document.getElementById('maskGrid');
  const maskSet = new Set();
  for(const devName of selectedDevices){
    for(const cat of Object.values(DEVICES)){
      if(cat[devName]){
        cat[devName].forEach(idx => maskSet.add(idx));
      }
    }
  }
  let html = '';
  MASK_COLS.forEach((col, i) => {
    const active = maskSet.has(i) ? 'active' : '';
    const devCount = (MASK_TO_DEVICES[i] || []).length;
    html += '<div class="mask-chip ' + active + '"><span class="dot"></span>' + col +
      '<span class="dev-badge">' + (active ? devCount + ' devs' : '') + '</span></div>';
  });
  grid.innerHTML = html;
  document.getElementById('maskCount').textContent = maskSet.size;
  document.getElementById('devCount').textContent = selectedDevices.size;
}

function toggleDevice(name){
  if(selectedDevices.has(name)) selectedDevices.delete(name);
  else selectedDevices.add(name);
  renderMaskGrid();
}

function toggleCat(el){
  el.classList.toggle('collapsed');
  el.nextElementSibling.classList.toggle('hidden');
}

function selectAll(){
  for(const cat of Object.values(DEVICES)){
    for(const name of Object.keys(cat)) selectedDevices.add(name);
  }
  renderDevicePanel();
  renderMaskGrid();
}

function deselectAll(){
  selectedDevices.clear();
  renderDevicePanel();
  renderMaskGrid();
}

function selectByCategory(){
  const cats = Object.keys(DEVICES);
  const choice = prompt('Enter category name:\n\n' + cats.join(', '));
  if(choice && DEVICES[choice]){
    for(const name of Object.keys(DEVICES[choice])) selectedDevices.add(name);
    renderDevicePanel();
    renderMaskGrid();
  }
}

function exportList(){
  const maskSet = new Set();
  for(const devName of selectedDevices){
    for(const cat of Object.values(DEVICES)){
      if(cat[devName]){
        cat[devName].forEach(idx => maskSet.add(idx));
      }
    }
  }
  let text = 'SMIC HBCCDA Mask Selection\n';
  text += '========================\n\n';
  text += 'Selected Devices (' + selectedDevices.size + '):\n';
  for(const name of selectedDevices){
    const desc = DESC_MAP[name] || '';
    text += '  ' + name + (desc ? ' (' + desc + ')' : '') + '\n';
  }
  text += '\nRequired Mask Layers (' + maskSet.size + '):\n';
  const sorted = Array.from(maskSet).sort((a,b)=>a-b);
  for(const i of sorted){
    text += '  ' + (i+1) + '. ' + MASK_COLS[i] + '\n';
  }
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'smic_mask_selection.txt';
  a.click();
}

// ═══ Mask → Device mode ═══
function renderMaskGridReverse(){
  const grid = document.getElementById('maskGridReverse');
  let html = '';
  MASK_COLS.forEach((col, i) => {
    const devCount = (MASK_TO_DEVICES[i] || []).length;
    const selected = selectedMasks.has(i) ? 'active' : '';
    html += '<div class="mask-chip clickable ' + selected + '" onclick="toggleMask(' + i + ', this)" data-mask="' + i + '">' +
      '<span class="dot"></span>' + col +
      '<span class="dev-badge">' + devCount + ' devs</span></div>';
  });
  grid.innerHTML = html;
}

function toggleMask(idx, el){
  if(selectedMasks.has(idx)){
    selectedMasks.delete(idx);
    el.classList.remove('active');
  } else {
    selectedMasks.add(idx);
    el.classList.add('active');
  }
  showMaskDetail(idx);
}

function showMaskDetail(idx){
  const detail = document.getElementById('maskDetail');
  const title = document.getElementById('maskDetailTitle');
  const countInfo = document.getElementById('maskDetailCount');
  const list = document.getElementById('maskDetailList');
  const devs = MASK_TO_DEVICES[idx] || [];
  title.textContent = 'Mask ' + (idx+1) + ': ' + MASK_COLS[idx];
  countInfo.textContent = devs.length + ' device(s) use this mask layer';
  const byCat = {};
  for(const d of devs){
    if(!byCat[d.cat]) byCat[d.cat] = [];
    byCat[d.cat].push(d);
  }
  let html = '';
  for(const [cat, items] of Object.entries(byCat)){
    for(const d of items){
      html += '<div class="dev-item"><span class="cat-tag">' + cat + '</span><span class="dev-name">' + d.name + '</span>' +
        (d.desc ? '<span class="dev-desc">' + d.desc + '</span>' : '') + '</div>';
    }
  }
  list.innerHTML = html;
  detail.classList.add('show');
  document.querySelectorAll('#maskGridReverse .mask-chip').forEach(chip => {
    chip.classList.toggle('highlight', parseInt(chip.dataset.mask) === idx);
  });
}

function closeMaskDetail(){
  document.getElementById('maskDetail').classList.remove('show');
  document.querySelectorAll('#maskGridReverse .mask-chip.highlight').forEach(c => c.classList.remove('highlight'));
}

function clearMaskSelection(){
  selectedMasks.clear();
  closeMaskDetail();
  renderMaskGridReverse();
}

function exportMaskDevices(){
  if(selectedMasks.size === 0){ alert('Please click mask layers first.'); return; }
  const sortedMasks = Array.from(selectedMasks).sort((a,b)=>a-b);
  let text = 'SMIC HBCCDA - Mask to Device Mapping\n';
  text += '======================================\n\n';
  for(const mi of sortedMasks){
    const devs = MASK_TO_DEVICES[mi] || [];
    text += (mi+1) + '. ' + MASK_COLS[mi] + ' (' + devs.length + ' devices):\n';
    const byCat = {};
    for(const d of devs){
      if(!byCat[d.cat]) byCat[d.cat] = [];
      byCat[d.cat].push(d);
    }
    for(const [cat, items] of Object.entries(byCat)){
      for(const d of items){
        text += '  [' + cat + '] ' + d.name + (d.desc ? ' - ' + d.desc : '') + '\n';
      }
    }
    text += '\n';
  }
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'smic_mask_to_devices.txt';
  a.click();
}

// ═══ Tooltip ═══
function showTip(e, name){
  const tip = document.getElementById('tooltip');
  const desc = DESC_MAP[name] || '';
  const masks = [];
  for(const cat of Object.values(DEVICES)){
    if(cat[name]){ masks.push(...cat[name]); break; }
  }
  const maskNames = masks.map(i => MASK_COLS[i]).join(', ');
  tip.innerHTML = '<strong>' + name + '</strong>' +
    (desc ? '<div class="tt-desc">' + desc + '</div>' : '') +
    '<div class="tt-masks">' + masks.length + ' masks: ' + maskNames + '</div>';
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 320) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
}
function hideTip(){
  document.getElementById('tooltip').style.display = 'none';
}

// ═══ Init ═══
renderDevicePanel();
renderMaskGrid();
</script>
